name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # weekly Mon 06:00 UTC — catch live form drift

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install black flake8
      - run: black --check .
      - run: flake8 .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v

  live-form-tests:
    # Pulls the real Google Form sheets and validates the ETL still normalizes
    # them. Separate job so a Google outage fails only this check, not the core
    # matrix. Runs on PRs/pushes and weekly via the schedule above. Override the
    # sheet IDs with repo variables TIMESPACE_PROCESS_SHEET_ID /
    # TIMESPACE_MEASUREMENT_SHEET_ID to repoint at the canonical forms.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"
      - name: Pull live Google Form sheets and validate schema
        env:
          TIMESPACE_LIVE_FORM_TESTS: "1"
          TIMESPACE_PROCESS_SHEET_ID: ${{ vars.TIMESPACE_PROCESS_SHEET_ID }}
          TIMESPACE_MEASUREMENT_SHEET_ID: ${{ vars.TIMESPACE_MEASUREMENT_SHEET_ID }}
        run: python -m pytest tests/test_form_live.py -v
